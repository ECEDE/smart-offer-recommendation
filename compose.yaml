services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SMART_OFFER_DB: /data/smart_offers.db
    volumes:
      - smart_offer_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  smart_offer_data:
